spring.application.name=Proj
server.port=8080

# File Upload Configuration (LLD §13)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/acadconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (LLD §11)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# File Storage Location (LLD §13)
app.file.upload-dir=./uploads

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
